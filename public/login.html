<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MyOnlineMeal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

  <section class="section">
    <div class="container">
      <div class="panel auth-card">
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" data-tab="login" role="tab">Login</button>
          <button type="button" class="tab" data-tab="register" role="tab">Create Account</button>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" placeholder="Your password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <form id="register-form" class="hidden" novalidate>
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" name="name" placeholder="Your full name" required autocomplete="name">
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="reg-phone">Phone No.</label>
            <input type="tel" id="reg-phone" name="phone" placeholder="+91 98765 43210" autocomplete="tel">
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" name="password" placeholder="At least 6 characters" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <p class="form-status" id="auth-status" role="alert"></p>
      </div>
    </div>
  </section>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
